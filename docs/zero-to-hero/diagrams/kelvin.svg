to Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11" font-weight="500" fill="#526174" text-anchor="middle" direction="rtl" >البطاقات: بطاقة رمادية واحدة تحت ضوء نهار تقريبًا 5600K، وثلاثة إعدادات لتوازن الأبيض (محاكاة توضيحية)</text><text x="300.0" y="247.0" font-family="'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11" font-weight="600" fill="#101827" text-anchor="middle" direction="rtl" >القاعدة: إذا ضبطت الكاميرا على رقم أقل من حرارة الضوء الفعلية تميل الصورة للأزرق، وأعلى منها تميل للبرتقالي</text></svg>