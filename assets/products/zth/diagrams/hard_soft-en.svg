<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Geometric comparison of a small distant light and a large close one, and how each sets the width of the penumbra"><title>Geometric comparison of a small distant light and a large close one, and how each sets the width of the penumbra</title><defs><linearGradient id="g310u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101827" stop-opacity=".08"/><stop offset="1" stop-color="#101827" stop-opacity=".85"/></linearGradient><linearGradient id="g310l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101827" stop-opacity=".85"/><stop offset="1" stop-color="#101827" stop-opacity=".08"/></linearGradient></defs><rect x="560" y="20" width="14" height="210" fill="#EFEDE6" stroke="#D8DBE0"/><rect x="560" y="70.0" width="14" height="8.3" fill="url(#g310u)"/><rect x="560" y="78.3" width="14" height="65.0" fill="#101827" opacity=".88"/><rect x="560" y="143.3" width="14" height="8.3" fill="url(#g310l)"/><line x1="340" y1="115.0" x2="560" y2="78.3" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><line x1="340" y1="125.0" x2="560" y2="70.0" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><line x1="340" y1="115.0" x2="560" y2="151.7" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><line x1="340" y1="125.0" x2="560" y2="143.3" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><rect x="335" y="115.0" width="10" height="10" rx="3" fill="#FFF4E2" stroke="#8A4F1C" stroke-width="1.6"/><rect x="457" y="95" width="6" height="40" fill="#16263E"/><text x="440.0" y="16.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="12.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Small, distant source → hard edge</text><text x="554.0" y="246.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11" font-weight="700" fill="#8A4F1C" text-anchor="end" direction="ltr" >Narrow penumbra</text><text x="340.0" y="143.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="10.5" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >Source</text><text x="460.0" y="151.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="10.5" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >Subject</text><text x="440.0" y="268.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >Light turns to shadow quickly</text><defs><linearGradient id="g10u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101827" stop-opacity=".08"/><stop offset="1" stop-color="#101827" stop-opacity=".85"/></linearGradient><linearGradient id="g10l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101827" stop-opacity=".85"/><stop offset="1" stop-color="#101827" stop-opacity=".08"/></linearGradient></defs><rect x="260" y="20" width="14" height="210" fill="#EFEDE6" stroke="#D8DBE0"/><rect x="260" y="33.9" width="14" height="66.7" fill="url(#g10u)"/><rect x="260" y="100.6" width="14" height="17.8" fill="#101827" opacity=".88"/><rect x="260" y="118.3" width="14" height="66.7" fill="url(#g10l)"/><line x1="70" y1="90.0" x2="260" y2="100.6" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><line x1="70" y1="150.0" x2="260" y2="33.9" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><line x1="70" y1="90.0" x2="260" y2="185.0" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><line x1="70" y1="150.0" x2="260" y2="118.3" stroke="#E3A86B" stroke-width="1" stroke-dasharray="3 3"/><rect x="65" y="90.0" width="10" height="60" rx="3" fill="#FFF4E2" stroke="#8A4F1C" stroke-width="1.6"/><rect x="157" y="95" width="6" height="40" fill="#16263E"/><text x="140.0" y="16.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="12.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Large, close source → soft edge</text><text x="254.0" y="246.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11" font-weight="700" fill="#8A4F1C" text-anchor="end" direction="ltr" >Wide penumbra</text><text x="70.0" y="168.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="10.5" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >Source</text><text x="160.0" y="151.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="10.5" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >Subject</text><text x="140.0" y="268.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >A wider penumbra makes the shadow look softer</text><line x1="300" y1="20" x2="300" y2="270" stroke="#D8DBE0"/><rect x="420" y="282" width="12" height="12" fill="#101827" opacity=".88"/><text x="414.0" y="292.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="10.5" font-weight="600" fill="#101827" text-anchor="end" direction="ltr" >Umbra</text><rect x="230" y="282" width="12" height="12" fill="url(#g10u)"/><text x="224.0" y="292.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="10.5" font-weight="600" fill="#101827" text-anchor="end" direction="ltr" >Penumbra</text></svg>