th','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#8A4F1C" text-anchor="start" direction="ltr" >After recording: process in order, gently</text><rect x="16.0" y="138" width="102" height="54" rx="6" fill="#FFFFFF" stroke="#8A4F1C" stroke-width="1.6"/><text x="67.0" y="161.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Gentle clean-up</text><text x="67.0" y="179.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >Steady noise only</text><rect x="128.0" y="138" width="102" height="54" rx="6" fill="#FFFFFF" stroke="#8A4F1C" stroke-width="1.6"/><text x="179.0" y="161.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >High-pass</text><text x="179.0" y="179.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >~80 Hz for speech</text><line x1="119.0" y1="165" x2="126.5" y2="165" stroke="#101827" stroke-width="1.4" marker-end="url(#sc)"/><rect x="240.0" y="138" width="102" height="54" rx="6" fill="#FFFFFF" stroke="#8A4F1C" stroke-width="1.6"/><text x="291.0" y="161.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Corrective EQ</text><text x="291.0" y="179.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >Cut before boost</text><line x1="231.0" y1="165" x2="238.5" y2="165" stroke="#101827" stroke-width="1.4" marker-end="url(#sc)"/><rect x="352.0" y="138" width="102" height="54" rx="6" fill="#FFFFFF" stroke="#8A4F1C" stroke-width="1.6"/><text x="403.0" y="161.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Compressor</text><text x="403.0" y="179.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >2:1 to 4:1 to start</text><line x1="343.0" y1="165" x2="350.5" y2="165" stroke="#101827" stroke-width="1.4" marker-end="url(#sc)"/><rect x="464.0" y="138" width="102" height="54" rx="6" fill="#FFFFFF" stroke="#8A4F1C" stroke-width="1.6"/><text x="515.0" y="161.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Delivery level</text><text x="515.0" y="179.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >LUFS and True Peak</text><line x1="455.0" y1="165" x2="462.5" y2="165" stroke="#101827" stroke-width="1.4" marker-end="url(#sc)"/><path d="M515.0,84 v16 H6 V165 H13" fill="none" stroke="#101827" stroke-width="1.4" marker-end="url(#sc)"/><rect x="40" y="244" width="520" height="16" rx="3" fill="#EFEDE6"/><rect x="365.0" y="244" width="130.0" height="16" fill="#25C5D9" opacity=".55"/><rect x="495.0" y="244" width="54.2" height="16" fill="#E3A86B" opacity=".7"/><rect x="549.2" y="244" width="10.8" height="16" fill="#B54C43"/><line x1="40.0" y1="260" x2="40.0" y2="265" stroke="#526174"/><text x="40.0" y="277.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >−48 dBFS</text><line x1="170.0" y1="260" x2="170.0" y2="265" stroke="#526174"/><text x="170.0" y="277.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >−36 dBFS</text><line x1="300.0" y1="260" x2="300.0" y2="265" stroke="#526174"/><text x="300.0" y="277.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >−24 dBFS</text><line x1="365.0" y1="260" x2="365.0" y2="265" stroke="#526174"/><text x="365.0" y="277.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >−18 dBFS</text><line x1="430.0" y1="260" x2="430.0" y2="265" stroke="#526174"/><text x="430.0" y="277.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >−12 dBFS</text><line x1="495.0" y1="260" x2="495.0" y2="265" stroke="#526174"/><text x="495.0" y="277.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >−6 dBFS</text><line x1="560.0" y1="260" x2="560.0" y2="265" stroke="#526174"/><text x="560.0" y="277.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="600" fill="#526174" text-anchor="middle" direction="ltr" >0 dBFS</text><text x="430.0" y="237.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="10.5" font-weight="700" fill="#0B6E7C" 