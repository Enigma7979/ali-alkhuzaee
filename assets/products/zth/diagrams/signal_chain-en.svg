<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 312" role="img" aria-label="The audio signal chain from mouth to delivery file, with the suggested level while recording"><title>The audio signal chain from mouth to delivery file, with the suggested level while recording</title><defs><marker id="sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#101827"/></marker></defs><text x="16.0" y="18.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#16263E" text-anchor="start" direction="ltr" >While recording: what is hard to fix later</text><rect x="16.0" y="30" width="102" height="54" rx="6" fill="#FFFFFF" stroke="#16263E" stroke-width="1.6"/><text x="67.0" y="53.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Sound source</text><text x="67.0" y="71.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >Mouth and delivery</text><rect x="128.0" y="30" width="102" height="54" rx="6" fill="#FFFFFF" stroke="#16263E" stroke-width="1.6"/><text x="179.0" y="53.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="11.5" font-weight="700" fill="#101827" text-anchor="middle" direction="ltr" >Room</text><text x="179.0" y="71.0" font-family="Manrope,'IBM Plex Sans Arabic','Noto Sans Math','Noto Sans Symbols 2',sans-serif" font-size="9.6" font-weight="500" fill="#526174" text-anchor="middle" direction="ltr" >Echo and noise</text><line x1="119.0" y1="57" x2="126.5" y2="57" stroke="#101827" stroke-width="1.4" marker-end="url(#sc)"/><rect x="240.0" y="30" width="102" height="54" rx="6" fill=