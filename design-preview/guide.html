<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creator Guide Samples</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#060b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;500;600;700&family=Geologica:wght@300;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/v2/ds.css">
<link rel="stylesheet" href="/assets/v2/guide.css">
</head>
<body class="guide-page">

<header class="pv-top">
 <div class="shell">
  <a class="brand" href="#deck" aria-label="Ali Alkhuzaee"><span class="brand-mark" aria-hidden="true">A</span><span>ALI ALKHUZAEE<small>CREATOR GUIDE · PREVIEW</small></span></a>
  <div class="lang-switch" role="group" aria-label="Language">
   <button type="button" data-lang="ar" aria-pressed="true" lang="ar">العربية</button>
   <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
   <button type="button" data-lang="ru" aria-pressed="false" lang="ru">RU</button>
  </div>
 </div>
</header>
<div class="pv-note"><div class="shell"><strong data-t="gBar"></strong><span data-t="gPhotoNote"></span></div></div>

<main id="deck" class="g-wrap">
 <div class="deck-shell g-deck" data-deck>
  <div class="deck-bar">
   <button class="deck-btn" type="button" data-prev data-t-label="prev"><span class="arrow" aria-hidden="true">←</span></button>
   <span class="title" id="deck-title" data-t="productTitle"></span>
   <span class="swipe-hint" data-t="swipeHint"></span>
   <output class="deck-count" dir="ltr" aria-live="polite" data-count>01 / 16</output>
   <button class="deck-btn" type="button" data-next data-t-label="next"><span class="arrow" aria-hidden="true">→</span></button>
  </div>
  <div class="deck-progress" aria-hidden="true"><i data-progress></i></div>
  <div class="deck-stage" data-stage>

   <!-- 01 Cover -->
   <article class="slide g-slide g-cover" data-slide="1" aria-roledescription="slide" aria-labelledby="g1-title">
    <figure class="g-bg kenburns"><img src="/assets/presentation/photos/a-1-dark-creator-studio-1600.webp" srcset="/assets/presentation/photos/a-1-dark-creator-studio-900.webp 900w,/assets/presentation/photos/a-1-dark-creator-studio-1600.webp 1600w" sizes="100vw" width="1600" height="1280" alt=""></figure>
    <div class="g-shade"></div>
    <div class="g-cover-grid">
     <div class="g-cover-copy">
      <p class="slide-num">01 · <span data-t="toc.0"></span></p>
      <p class="label" data-t="gCoverEyebrow"></p>
      <h3 id="g1-title" tabindex="-1" data-t="productTitle"></h3>
      <p class="lead" data-t="gCoverLead"></p>
      <div class="g-author">
       <img src="/assets/portraits/ali-kit-dark-520.webp" width="520" height="520" alt="" data-t-alt="gBy">
       <p><b data-t="gBy"></b><span data-t="gByRole"></span></p>
      </div>
      <div class="g-actions">
       <button class="btn btn-primary" type="button" data-goto="5"><span data-t="gStart"></span><span class="arrow" aria-hidden="true">→</span></button>
      </div>
      <ul class="g-meta"><li data-t="gMeta.0"></li><li data-t="gMeta.1"></li><li data-t="gMeta.2"></li><li data-t="gMeta.3"></li></ul>
     </div>
     <aside class="g-glass g-learn">
      <p class="label" data-t="gLearn"></p>
      <ol><li data-t="gLearnList.0"></li><li data-t="gLearnList.1"></li><li data-t="gLearnList.2"></li><li data-t="gLearnList.3"></li></ol>
     </aside>
    </div>
    <p class="g-credit" data-credit="a-1-dark-creator-studio"></p>
   </article>

   <!-- 05 Studio -->
   <article class="slide g-slide g-studio" data-slide="5" aria-roledescription="slide" aria-labelledby="g5-title" hidden>
    <div class="g-split">
     <figure class="g-photo" data-tier-photo>
      <img src="/assets/presentation/photos/b-1-phone-ring-light-1600.webp" width="1600" height="899" alt="" data-photo-img>
      <figcaption><span class="g-tag" data-t="gSetupExample"></span><span class="g-credit" data-photo-credit></span></figcaption>
     </figure>
     <div class="g-side">
      <p class="slide-num">05 · <span data-t="toc.4"></span></p>
      <h3 id="g5-title" tabindex="-1" data-t="gStudioTitle"></h3>
      <p class="lead" data-t="gStudioLead"></p>
      <div class="g-tabs" role="tablist" data-tabs="tier">
       <button type="button" role="tab" data-tab="0" data-photo="b-1-phone-ring-light"><b class="mono">€0–€20</b><span data-t="gTierNames.0"></span></button>
       <button type="button" role="tab" data-tab="1" data-photo="b-2-phones-tripod-ring-lights"><b class="mono">€40–€80</b><span data-t="gTierNames.1"></span></button>
       <button type="button" role="tab" data-tab="2" data-photo="a-2-camera-mic-desk-setup"><b class="mono">€100–€180</b><span data-t="gTierNames.2"></span></button>
      </div>
      <div class="g-glass g-panel" role="tabpanel" aria-live="polite">
       <ul class="g-list" data-tier-list></ul>
       <p class="g-tip" data-tier-tip></p>
      </div>
      <p class="fine" data-t="gBudgetNote"></p>
     </div>
    </div>
   </article>

   <!-- 07 Lighting -->
   <article class="slide g-slide g-light" data-slide="7" aria-roledescription="slide" aria-labelledby="g7-title" hidden>
    <figure class="g-bg" data-light-photo><img src="/assets/presentation/photos/c-1-octabox-studio-1600.webp" width="1600" height="1067" alt="" data-photo-img></figure>
    <div class="g-shade g-shade-bottom"></div>
    <div class="g-light-grid">
     <div class="g-light-head">
      <p class="slide-num">07 · <span data-t="toc.6"></span></p>
      <h3 id="g7-title" tabindex="-1" data-t="gLightTitle"></h3>
      <p class="lead" data-t="gLightLead"></p>
     </div>
     <div class="g-glass g-light-card">
      <div class="g-tabs g-tabs-row" role="tablist" data-tabs="light">
       <button type="button" role="tab" data-tab="0" data-photo="c-1-octabox-studio"><b class="mono">01</b><span data-t="gLights.0.0"></span></button>
       <button type="button" role="tab" data-tab="1" data-photo="c-2-softboxes-silhouette"><b class="mono">02</b><span data-t="gLights.1.0"></span></button>
       <button type="button" role="tab" data-tab="2" data-photo="d-2-rgb-laptop-setup"><b class="mono">03</b><span data-t="gLights.2.0"></span></button>
       <button type="button" role="tab" data-tab="3" data-photo="d-1-purple-desk-boom-mic"><b class="mono">04</b><span data-t="gLights.3.0"></span></button>
      </div>
      <div role="tabpanel" aria-live="polite"><h4 data-light-name></h4><p data-light-text></p></div>
      <p class="g-rule" data-t="gLightRule"></p>
     </div>
    </div>
    <p class="g-credit" data-photo-credit></p>
   </article>

   <!-- 11 AI tools -->
   <article class="slide g-slide g-tools" data-slide="11" aria-roledescription="slide" aria-labelledby="g11-title" hidden>
    <figure class="g-bg"><img src="/assets/presentation/photos/h-2-editor-dark-room-1600.webp" width="1600" height="1067" alt="" loading="lazy"></figure>
    <div class="g-shade g-shade-full"></div>
    <div class="g-tools-grid">
     <div class="g-tools-head">
      <p class="slide-num">11 · <span data-t="toc.10"></span></p>
      <h3 id="g11-title" tabindex="-1" data-t="gToolsTitle"></h3>
      <p class="lead" data-t="gToolsLead"></p>
     </div>
     <ul class="g-toolcards">
      <li class="g-glass g-tool g-tool-feature"><span class="g-mono-mark" aria-hidden="true">N</span><h4 data-t="gTools.0.0"></h4><a class="mono" href="https://notebooklm.google.com" target="_blank" rel="noopener" dir="ltr" data-t="gTools.0.1"></a><p data-t="gTools.0.2"></p><p class="g-limit" data-t="gTools.0.3"></p></li>
      <li class="g-glass g-tool"><span class="g-mono-mark" aria-hidden="true">C</span><h4 data-t="gTools.1.0"></h4><a class="mono" href="https://chatgpt.com" target="_blank" rel="noopener" dir="ltr" data-t="gTools.1.1"></a><p data-t="gTools.1.2"></p><p class="g-limit" data-t="gTools.1.3"></p></li>
      <li class="g-glass g-tool"><span class="g-mono-mark" aria-hidden="true">E</span><h4 data-t="gTools.2.0"></h4><a class="mono" href="https://elevenlabs.io" target="_blank" rel="noopener" dir="ltr" data-t="gTools.2.1"></a><p data-t="gTools.2.2"></p><p class="g-limit" data-t="gTools.2.3"></p></li>
      <li class="g-glass g-tool"><span class="g-mono-mark" aria-hidden="true">R</span><h4 data-t="gTools.3.0"></h4><a class="mono" href="https://runwayml.com" target="_blank" rel="noopener" dir="ltr" data-t="gTools.3.1"></a><p data-t="gTools.3.2"></p><p class="g-limit" data-t="gTools.3.3"></p></li>
     </ul>
     <a class="g-example" href="https://www.youtube.com/shorts/6m0NC1etQIU" target="_blank" rel="noopener">
      <img src="/assets/media-kit/6m0NC1etQIU.webp" width="720" height="1280" alt="" data-t-alt="videos.2.title" loading="lazy">
      <span class="g-example-copy"><span class="label" data-t="gRealExample"></span><b data-t="videos.2.title"></b><span class="g-example-cta"><span data-t="gSeeDemo"></span> <span class="arrow" aria-hidden="true">↗</span></span></span>
     </a>
     <p class="fine g-checked" data-t="gChecked"></p>
    </div>
    <p class="g-credit" data-credit="h-2-editor-dark-room"></p>
   </article>

  </div>
  <details class="toc">
   <summary><span data-t="sectionsLabel"></span></summary>
   <ol data-toc></ol>
  </details>
 </div>
</main>
