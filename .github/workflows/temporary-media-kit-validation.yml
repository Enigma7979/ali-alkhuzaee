name: Temporary Media Kit validation
on:
  push:
    branches: [feature/visible-contact-three-languages]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: |
          python -m pip install reportlab Pillow pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Check source and rebuild PDF
        run: |
          node --check media-kit/app.js
          python scripts/build_media_kit_pdf.py
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          from html.parser import HTMLParser
          from pypdf import PdfReader
          class Doc(HTMLParser):
              def __init__(self,s):
                  super().__init__();self.tags=[];self.stack=[];self.cards_inside_details=False;self.feed(s)
              def handle_starttag(self,t,a):
                  a=dict(a);self.tags.append((t,a))
                  if t=='article' and a.get('class')=='contact-card' and 'details' in self.stack:self.cards_inside_details=True
                  if t not in ['meta','link','img','br','input','hr']:self.stack.append(t)
              def handle_endtag(self,t):
                  if t in self.stack:
                      i=len(self.stack)-1-self.stack[::-1].index(t);self.stack=self.stack[:i]
          root=Path('index.html').read_text()
          source=re.search(r'<script>\s*(const copy=.*?)function setLanguage',root,re.S)[1]
          Path('/tmp/home-check.cjs').write_text(source+'\nconsole.log(JSON.stringify(copy));')
          home=json.loads(subprocess.check_output(['node','/tmp/home-check.cjs']))
          kit=json.loads(Path('media-kit/translations.json').read_text())
          assert set(home)==set(kit)=={'ar','en','fr','ru'}
          for name,copy,attr in [('index.html',home,'data-t'),('media-kit/index.html',kit,'data-i18n')]:
              text=Path(name).read_text();doc=Doc(text)
              assert not doc.cards_inside_details
              assert sum(t=='article' and a.get('class')=='contact-card' for t,a in doc.tags)==2
              assert [a.get('class') for t,a in doc.tags if t=='details']==['other-messaging']
              ids=[a['id'] for t,a in doc.tags if 'id' in a];assert len(ids)==len(set(ids))
              links=[a['href'] for t,a in doc.tags if t=='a']
              for link in ['tel:+32467685250','https://wa.me/32467685250','tel:+380637171771','https://wa.me/380637171771']:assert link in links
              assert not any(any(x in link for x in ['t.me/','viber:','botim','signal.me']) for link in links)
              for lang,fields in copy.items():
                  for t,a in doc.tags:
                      if attr in a:assert fields.get(a[attr]),(name,lang,a)
              for i,js in enumerate(re.findall(r'<script>(.*?)</script>',text,re.S)):
                  p=Path('/tmp/syntax-'+str(i)+'.js');p.write_text(js);subprocess.run(['node','--check',str(p)],check=True)
          for lang in kit:
              text=kit[lang]['internationalText']+' '+kit[lang]['formats'][6][1]+' '+home[lang]['aboutText']
              assert not any(s in text for s in ['Ukrainian','الأوكرانية','ukrainien','украинском','four languages','اللغات الأربع','quatre langues','четырёх языках'])
          assert home['en']['location']==kit['en']['location']=='Based in Belgium & Ukraine | Serving Clients Internationally'
          assert home['en']['navPartnerships']=='Brand Partnerships' and home['en']['workWithMe']=='Work With Me'
          assert sum(1 for t,a in Doc(Path('media-kit/index.html').read_text()).tags if t=='strong')==3
          assert not json.loads(Path('media-kit/data.json').read_text())['metrics']
          reader=PdfReader('media-kit/Ali-Alkhuzaee-Media-Kit.pdf');text='\n'.join(p.extract_text() for p in reader.pages)
          assert len(reader.pages)==2
          assert 'Arabic, English and Russian' in text and 'all three' in text
          assert 'Ukrainian' not in text and 'Based in Belgium & Ukraine | Serving Clients Internationally' in text and '18 years' in text
          print('SOURCE_AND_PDF_CHECKS_PASS')
          PY
          pdftoppm -scale-to 1000 -png media-kit/Ali-Alkhuzaee-Media-Kit.pdf /tmp/final-kit
      - name: Export reviewed deliverables
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for key,path in [('PDF','media-kit/Ali-Alkhuzaee-Media-Kit.pdf'),('PAGE1','/tmp/final-kit-1.png'),('PAGE2','/tmp/final-kit-2.png')]:
              encoded=base64.b64encode(Path(path).read_bytes()).decode()
              for i in range(0,len(encoded),50000):print('EXPORT_'+key+'_'+str(i//50000)+'::'+encoded[i:i+50000])
          PY
